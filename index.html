/* Layout: fixed study-desk sidebar (transcript shelf) + reading column of notes; highlighter-marker accent for key terms. */

  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#E8ECF3; --fg:#18202C; --muted:#5A6577; --line:#D5DBE5;
  --accent:#2B54D6; --accent-soft:#DCE4FB; --on-accent:#FFFFFF;
  --marker:#FFE27A; --marker-fg:#18202C; --danger:#B4232F; --ok:#1F7A4D;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --side:288px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141B; --surface:#171C25; --sunk:#1F2530; --fg:#E5E9F0; --muted:#98A3B5; --line:#2C3442;
  --accent:#8FA7FF; --accent-soft:#25304D; --on-accent:#0E1424;
  --marker:#5C4D12; --marker-fg:#FFF3C4; --danger:#FF8A93; --ok:#6FD3A0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141B; --surface:#171C25; --sunk:#1F2530; --fg:#E5E9F0; --muted:#98A3B5; --line:#2C3442;
  --accent:#8FA7FF; --accent-soft:#25304D; --on-accent:#0E1424;
  --marker:#5C4D12; --marker-fg:#FFF3C4; --danger:#FF8A93; --ok:#6FD3A0; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.label,.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
mark{background:var(--marker);color:var(--marker-fg);padding:0 .18em;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}

.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:19px}
.brand svg{flex:none}
.side .new{width:100%}
.shelf{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.shelf-item{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:10px 12px;cursor:pointer}

.shelf-item .m{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--marker);color:var(--marker-fg);border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:1px}
.side-note{font-size:13px;color:var(--muted)}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700;font-size:14.5px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:13px 22px;font-size:16px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}

.main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:820px;margin:0 auto}
.topbar{display:none}

/* composer */
.composer{display:flex;flex-direction:column;gap:18px}
.composer h1{font-size:clamp(28px,4vw,40px);font-weight:800}
.lede{color:var(--muted);max-width:62ch;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
.drop{border:1.5px dashed var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop textarea{display:block;width:100%;min-height:300px;resize:vertical;border:0;background:transparent;padding:16px;line-height:1.55;font-size:15px}
.drop textarea:focus-visible{outline:none}
.drop-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 14px;border-top:1px solid var(--line);background:var(--sunk);font-size:13.5px;color:var(--muted)}
.count{margin-left:auto;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.gen-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.msg{font-size:14px;color:var(--muted)}
.msg.err{color:var(--danger)}
.progress{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.bar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:var(--accent);border-radius:6px;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%;opacity:.5}}
.progress ul{margin:0;padding-left:20px;font-size:14px}

.note{display:flex;flex-direction:column;gap:30px}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:12px 16px;font-size:14.5px}
.note-head{display:flex;flex-direction:column;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.note-head h1{font-size:clamp(30px,4.6vw,46px);font-weight:800;letter-spacing:-.01em}
.subtitle{margin:0;color:var(--muted);font-size:18px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.rename-in{font-family:var(--f-display);font-size:clamp(26px,4vw,38px);font-weight:800}
.bigidea{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.bigidea p{margin:0;font-size:18px}
.toc ol{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px;counter-reset:t}
.toc button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;counter-increment:t}
.toc button::before{content:counter(t) ". ";color:var(--muted);font-family:var(--f-mono);font-size:12px}
.toc button:hover{border-color:var(--accent)}
.sec{display:flex;flex-direction:column;gap:16px;padding-top:8px;scroll-margin-top:16px}
.sec h2{font-size:clamp(22px,3vw,29px);font-weight:700}
.sec-n{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.06em}
.explain p{margin:0 0 .8em;max-width:68ch}
.explain p:last-child{margin-bottom:0}
figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px}
figure .scroll{overflow-x:auto}
figure svg{display:block;width:100%;min-width:560px;height:auto}
figcaption{font-size:13px;color:var(--muted);margin-top:6px;display:flex;gap:8px;align-items:baseline}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{min-width:0;border-radius:14px;padding:16px 18px;background:var(--surface);border:1px solid var(--line)}
.card h3{font-size:15px;font-weight:700;margin-bottom:8px}
.card ul{margin:0;padding-left:20px}
.card li{margin-bottom:4px}
.card p{margin:0}
.card.example{background:var(--sunk);border-color:var(--sunk)}
.remember{margin:0;display:flex;gap:12px;align-items:baseline;font-weight:700;font-size:17px}
.remember .label{flex:none;color:var(--accent)}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.gloss div{min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.gloss dt{font-weight:700}
.gloss dd{margin:2px 0 0;color:var(--muted);font-size:15px}
.quiz{display:flex;flex-direction:column;gap:8px}
.quiz details{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 16px}
.quiz summary{cursor:pointer;font-weight:700}
.quiz details p{margin:8px 0 0;color:var(--muted)}
.end-h{font-size:24px;font-weight:700;margin-bottom:12px}
.addpanel{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:18px 20px}
.addpanel .drop textarea{min-height:160px}
.modes{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.modes legend{margin-bottom:6px}
.mode{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.mode:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.mode small{display:block;color:var(--muted);font-size:13.5px;line-height:1.4}
.mode input{margin-top:5px;accent-color:var(--accent)}
#contSec{margin-left:34px;width:calc(100% - 34px)}
.txview summary{cursor:pointer;font-weight:700}
.txview textarea{margin-top:10px;min-height:220px;resize:vertical;font-size:14px;line-height:1.5}
.txview .gen-row{margin-top:10px}
.chip{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 8px;margin-left:8px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}

/* PDF stage: always light, fixed width, offscreen */
.pdf-stage{position:fixed;left:-12000px;top:0;width:720px;
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#EEF1F6; --fg:#18202C; --muted:#4F5A6B; --line:#D5DBE5;
  --accent:#2B54D6; --accent-soft:#DCE4FB; --on-accent:#FFFFFF; --marker:#FFE27A; --marker-fg:#18202C;
  background:#FFFFFF;color:#18202C;font-family:var(--f-body);font-size:15px;line-height:1.55}
.pdf-stage [data-block]{padding:6px 0;background:#FFFFFF}
.pdf-stage .note{gap:0}
.pdf-stage .sec{gap:0;padding:0}
.pdf-stage figure svg{min-width:0}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:40;transform:translateX(-105%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.25);height:100%;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:35}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
  .main{padding-top:16px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>

const SAMPLE_TRANSCRIPT = `[00:00] Okay everyone, let's get started. Today we're talking about photosynthesis, which is honestly one of the most important processes on the planet.
[00:12] So, the basic idea. Plants take in light energy, water, and carbon dioxide, and they turn that into glucose, which is a sugar, and oxygen. The equation is six CO2 plus six H2O, with light, gives you C6H12O6 plus six O2.
[00:41] Where does this happen? In the chloroplasts. These are little structures inside plant cells, mostly in the leaves. They contain a green pigment called chlorophyll, and chlorophyll is what absorbs the light. It absorbs red and blue light really well, and reflects green, which is why leaves look green.
[01:20] Now photosynthesis actually happens in two stages. Stage one is the light-dependent reactions. These happen in the thylakoid membranes. Light hits chlorophyll, energy is used to split water molecules. That's where the oxygen comes from, by the way, it comes from the water, not from the CO2. People get that wrong in exams all the time.
[02:05] Splitting water also releases energy that gets stored in two carrier molecules, ATP and NADPH. Think of them like charged batteries.
[02:20] Stage two is the Calvin cycle, sometimes called the light-independent reactions. This happens in the stroma, the fluid around the thylakoids. Here the plant uses those charged batteries, the ATP and NADPH, to grab carbon dioxide from the air and build it into glucose. An enzyme called RuBisCO does the grabbing. RuBisCO is probably the most abundant protein on Earth.
[03:10] And it's a cycle because the starting molecule, RuBP, gets regenerated at the end so the whole thing can go again.
[03:22] What affects the rate of photosynthesis? Three main limiting factors. Light intensity, carbon dioxide concentration, and temperature. If any one of these is low, it holds the whole process back, even if the others are plentiful. Farmers use this in greenhouses: they pump in extra CO2 and keep it warm and bright to grow crops faster.
[04:05] But temperature has a catch. Above about 35 to 40 degrees, the enzymes start to denature, they lose their shape, and the rate drops sharply.
[04:20] Finally, why does this matter? Almost all food chains start with photosynthesis. And it's the source of the oxygen we breathe. It also removes carbon dioxide from the atmosphere, which matters for climate.
[04:40] For next week, read chapter seven and compare photosynthesis with respiration. You'll notice they're kind of the reverse of each other.`;

const LS_KEY = "revisionDesk.notes.v1";
const store = {
  kind: "local", col: null, notes: [], loaded: false,
  readLocal(){ try { const v = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); return Array.isArray(v) ? v : []; } catch(e){ return []; } },
  writeLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(this.notes)); return true; } catch(e){ return false; } },
  async init(){
    this.notes = this.readLocal().sort((a,b)=>b.createdAt-a.createdAt);
    const [db, user] = await Promise.all([cap("db"), cap("user")]);
    let uid = null;
    if (db && user){ try { uid = await user.id(); } catch(e){ uid = null; } }
    if (!db || !uid){ this.loaded = true; $("#storeNote").textContent = "Notes are saved in this browser only."; onNotes(); return; }
    this.kind = "db";
    try { this.col = db.collection("data/users/" + uid + "/desk/notes"); }
    catch(e){ this.kind = "local"; this.loaded = true; $("#storeNote").textContent = "Notes are saved in this browser only."; onNotes(); return; }
    const timer = setTimeout(() => { if (!this.loaded){ this.loaded = true; $("#sideNote").textContent = "Couldn't reach your saved notes. Notes you make now may not be saved."; } }, 10000);
    this.col.orderBy("createdAt","desc").onSnapshot(snap => {
      clearTimeout(timer); this.loaded = true;
      this.notes = snap.docs.map(d => Object.assign({}, d.data(), {id: d.id}));
      $("#storeNote").textContent = "Saved to your account. Only you can see these notes.";
      onNotes();
    }, () => { clearTimeout(timer); this.loaded = true; $("#sideNote").textContent = "Couldn't load your saved notes."; onNotes(); });
  },
  async save(note){
    const { id, ...body } = note;
    if (this.kind === "db"){ await this.col.doc(id).set(body); return; }
    this.notes = [note, ...this.notes.filter(n => n.id !== id)];
    if (!this.writeLocal()) throw new Error("Browser storage is full or blocked.");
    onNotes();
  },
  async update(id, patch){
    if (this.kind === "db"){ await this.col.doc(id).update(patch); return; }
    this.notes = this.notes.map(n => n.id === id ? Object.assign({}, n, patch) : n); this.writeLocal(); onNotes();
  },
  async remove(id){
    if (this.kind === "db"){ await this.col.doc(id).delete(); return; }

    else if (code === "not_granted") setMsg("Claude access was turned off for this page. Allow it from the page's permissions to make notes.", true);
    else if (code === "rate_limited") setMsg("You've hit a usage limit for now. Wait a few minutes and try again.", true);
    else if (code === "invalid_json") setMsg("Claude's answer came back incomplete. Press the button to try again, or try a shorter transcript.", true);
    else if (code === "prompt_too_large") setMsg("This transcript is too long. Split it into parts and make notes for each.", true);
    else setMsg("Something went wrong making the notes. Try again.", true);
  }
}
function normalize(r){
  const a = v => Array.isArray(v) ? v : [], s = v => typeof v === "string" ? v : (v == null ? "" : String(v));
  r = r && typeof r === "object" ? r : {};
  return {
    title: s(r.title).slice(0,160) || "Untitled transcript",
    subtitle: s(r.subtitle).slice(0,240), bigIdea: s(r.bigIdea),
    sections: a(r.sections).slice(0,10).map(x => ({heading: s(x && x.heading) || "Section", explanation: s(x && x.explanation), keyPoints: a(x && x.keyPoints).map(s).slice(0,7), example: s(x && x.example), remember: s(x && x.remember), diagram: x && x.diagram && typeof x.diagram === "object" && DTYPE[x.diagram.type] ? x.diagram : null})),
    glossary: a(r.glossary).map(g => ({term: s(g && g.term), meaning: s(g && g.meaning)})).filter(g => g.term).slice(0,14),
    quiz: a(r.quiz).map(q => ({q: s(q && q.q), a: s(q && q.a)})).filter(q => q.q).slice(0,8)
  };
}

function mountDiagrams(root, n, C){
  root.querySelectorAll("[data-diagram]").forEach(el => { const s = n.sections[+el.dataset.diagram]; el.innerHTML = s ? renderDiagram(s.diagram, C) : ""; });
}
function renderNote(){
  const n = findNote(S.current) || EXAMPLE;
  const v = $("#view"); v.innerHTML = noteHTML(n, false);
  mountDiagrams(v, n, themeC());
  v.querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => { const t = document.getElementById("sec-" + b.dataset.jump); if (t) t.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"}); }));
  const act = a => v.querySelector(`[data-act="${a}"]`);
  act("new") && act("new").addEventListener("click", openComposer);
  act("pdf").addEventListener("click", e => exportPdf(n, e.currentTarget));
  if (act("rename")) act("rename").addEventListener("click", () => startRename(n));
  if (act("add")) wireAddPanel(n, v, act("add"));

    const d = act("delete");
    d.addEventListener("click", async () => {
      if (!d.dataset.armed){ d.dataset.armed = "1"; d.textContent = "Click again to delete"; setTimeout(() => { if (d.isConnected){ delete d.dataset.armed; d.textContent = "Delete"; } }, 4000); return; }
      d.disabled = true;
      try { await store.remove(n.id); store.notes = store.notes.filter(x => x.id !== n.id); S.current = store.notes[0]?.id || "example"; render(); toast("Notes deleted."); }
      catch(e){ d.disabled = false; toast("Couldn't delete these notes. Try again."); }
    });
  }
}
function startRename(n){
  S.renaming = true;
  const h = $("#noteTitle"); const inp = document.createElement("input");
  inp.className = "input rename-in"; inp.id = "renameIn"; inp.value = n.title; inp.maxLength = 160; inp.setAttribute("aria-label","Title");
  h.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const finish = async save => {
    if (done) return; done = true; S.renaming = false;
    const t = inp.value.trim();
    if (save && t && t !== n.title){ n.title = t; try { await store.update(n.id, {title: t}); toast("Renamed."); } catch(e){ toast("Couldn't save the new title."); } }
    renderShelf(); renderNote();
  };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); });
  inp.addEventListener("blur", () => finish(true));
}

/* ---------- Add to transcript: new sections, continue a section, or rebuild ---------- */
const DIAGRAM_SPEC = PROMPT.slice(PROMPT.indexOf("DIAGRAM is one of"), PROMPT.indexOf("Rules:")).trim();
const SECTION_SHAPE = `{"heading":"clear subheading","explanation":"2-3 short paragraphs separated by \\n\\n","keyPoints":["3-5 short points"],"example":"a concrete everyday example or analogy, 1-3 sentences","remember":"one-sentence takeaway","diagram":DIAGRAM_OR_NULL}`;
const STYLE = `Write in plain, simple language: short sentences, everyday words, and explain any jargon the first time you use it. You may add simple everyday examples and analogies to make ideas clear. Wrap 1-3 key terms per explanation in **double asterisks** so they can be highlighted. No other markdown. Ignore filler, small talk and housekeeping.`;
function addNewPrompt(n, text){
  const outline = n.sections.map((s,i) => `${i+1}. ${s.heading}`).join("\n");
  const terms = (n.glossary || []).map(g => g.term).join(", ") || "none";
  return `You are extending an existing set of revision notes for a student with new transcript content. ${STYLE}

Existing notes title: "${n.title}"
Existing sections:
${outline}
Existing key terms: ${terms}

Turn ONLY the new transcript content below into 1-4 new sections that follow on from the existing ones. Do not repeat what the existing sections already cover. Reply with only JSON in exactly this shape:
{"sections":[${SECTION_SHAPE}],"glossary":[{"term":"","meaning":"one plain sentence"}],"quiz":[{"q":"question","a":"short answer"}]}
glossary: 0-5 terms that are not already listed. quiz: 1-3 questions about the new content. Give a diagram to each section where a picture helps.

${DIAGRAM_SPEC}

NEW TRANSCRIPT CONTENT:
<<<
${text}
>>>`;
}
function contPrompt(n, sec, text){
  const terms = (n.glossary || []).map(g => g.term).join(", ") || "none";
  const existing = JSON.stringify({heading: sec.heading, explanation: sec.explanation, keyPoints: sec.keyPoints, example: sec.example, remember: sec.remember, diagram: sec.diagram});
  return `You are adding to one section of an existing set of revision notes for a student. The new transcript content below continues this section. ${STYLE}

Notes title: "${n.title}"
The existing section, as JSON:
${existing}

Write only what the new content adds. Do not rewrite or repeat what the section already says. Reply with only JSON in exactly this shape:
{"addedExplanation":"1-2 short paragraphs covering only the new material, written to follow on from the existing text","addedKeyPoints":["0-3 new short points"],"extraExample":"another everyday example if the new material needs one, otherwise an empty string","remember":"one-sentence takeaway for the whole section, updated if needed","diagram":null,"glossary":[{"term":"","meaning":"one plain sentence"}],"quiz":[{"q":"question","a":"short answer"}]}
Set "diagram" to a complete updated diagram only if the new content changes or extends the picture (keep the existing type if it still fits); otherwise null. glossary: 0-3 new terms not in: ${terms}. quiz: 0-2 questions on the new material.

${DIAGRAM_SPEC}

NEW TRANSCRIPT CONTENT:
<<<
${text}
>>>`;
}
function errText(e){
  if (e && e.friendly) return e.friendly;
  const code = e && e.code;
  if (code === "aborted" || (e && e.name === "AbortError")) return "Cancelled. Nothing was changed.";
  if (code === "not_granted") return "Claude access was turned off for this page. Allow it from the page's permissions to add content.";
  if (code === "rate_limited") return "You've hit a usage limit for now. Wait a few minutes and try again.";
  if (code === "invalid_json") return "Claude's answer came back incomplete. Nothing was changed. Try again, or add a shorter piece.";
  if (code === "prompt_too_large") return "This content is too long. Add it in smaller parts.";
  return "Something went wrong. Nothing was changed. Try again.";
}
async function askClaude(prompt, onText){
  const sample = await cap("sample");
  if (!sample) throw {friendly: "Claude isn't available in this view. Open this app on claude.ai while signed in."};
  const ctrl = new AbortController(); S.generating = ctrl;
  try { return await sample.json(prompt, {signal: ctrl.signal, onText, modelTier: "default"}); }
  finally { S.generating = null; }
}
function addPanelHTML(n){
  const hasTx = typeof n.transcript === "string" && n.transcript.length > 0;
  const opts = (n.sections || []).map((s,i) => `<option value="${i}">${i+1}. ${esc(s.heading)}</option>`).join("");
  const mode = S.addMode || "new";
  const ck = m => mode === m ? " checked" : "";
  return `<section class="addpanel" id="addPanel"${S.addOpen ? "" : " hidden"} aria-label="Add to this transcript">
    <div><h2 class="end-h" style="margin-bottom:4px">Add to this transcript</h2>
      <p class="msg" style="margin:0">Paste or upload the extra part of the transcript. Only the new part is turned into notes. Everything already here stays as it is.</p></div>
    <div class="drop" id="addDrop">
      <textarea id="addTx" placeholder="Paste the additional transcript content here…" aria-label="Additional transcript content"></textarea>
      <div class="drop-bar"><label class="btn" for="addFile">Upload file</label><input type="file" id="addFile" accept=".txt,.md,.vtt,.srt,.text,text/plain" hidden><span>.txt, .md, .vtt, .srt</span><span class="count" id="addCount">0 words</span></div>
    </div>
    <fieldset class="modes"><legend class="label">How should it be added?</legend>
      <label class="mode"><input type="radio" name="addMode" value="new"${ck("new")}><span><strong>As new section(s)</strong><small>New sections go after the existing ones, each with its own subheading.</small></span></label>
      <label class="mode"><input type="radio" name="addMode" value="cont"${ck("cont")}><span><strong>Continue an existing section</strong><small>The new material is added to the end of the section you pick. What's already there is kept.</small></span></label>
      <select id="contSec" class="input" aria-label="Section to continue"${mode === "cont" ? "" : " disabled"}>${opts}</select>
      <label class="mode"><input type="radio" name="addMode" value="rebuild"${ck("rebuild")}${hasTx ? "" : " disabled"}><span><strong>Rebuild all notes</strong><small>${hasTx ? "Regenerates every section from the full transcript with the new part added. This replaces the current notes." : "Not available: the original transcript wasn't stored with these notes."}</small></span></label>
    </fieldset>
    <div class="gen-row"><button type="button" class="btn primary" id="addGo">Add as new sections</button><button type="button" class="btn" id="addClose">Close</button><span class="msg" id="addMsg"></span></div>
    <div class="progress" id="addProg" hidden>
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><strong id="addProgTitle">Reading the new content…</strong><button type="button" class="link" id="addCancel">Cancel</button></div>
      <div class="bar"><i></i></div>
      <div class="msg" id="addStat">This usually takes under a minute.</div>
      <ul id="addList"></ul>
    </div>
    <details class="txview" id="txView"><summary>View or edit the full transcript</summary>
      ${hasTx ? `<textarea id="fullTx" class="input" aria-label="Full transcript"></textarea>
      <div class="gen-row"><button type="button" class="btn" id="saveTx">Save transcript</button><span class="msg" id="txMsg">Saving changes the stored transcript only. Choose "Rebuild all notes" to update the notes from it.</span></div>`
      : `<p class="msg">The original transcript wasn't stored with these notes, so it can't be shown here.</p>`}
    </details>
  </section>`;
}
function wireAddPanel(n, v, toggleBtn){
  const panel = v.querySelector("#addPanel"); if (!panel) return;
  const tx = panel.querySelector("#addTx"), go = panel.querySelector("#addGo"), sel = panel.querySelector("#contSec");
  const labels = {new: "Add as new sections", cont: "Add to this section", rebuild: "Rebuild all notes"};
  tx.value = S.addDraft || "";
  const count = () => { S.addDraft = tx.value; panel.querySelector("#addCount").textContent = `${((tx.value.match(/\S+/g) || []).length).toLocaleString()} words`; };
  tx.addEventListener("input", count); count();
  if (S.addSec != null && sel.options[S.addSec]) sel.value = String(S.addSec);
  sel.addEventListener("change", () => S.addSec = +sel.value);
  const syncMode = () => { const m = panel.querySelector('input[name="addMode"]:checked').value; S.addMode = m; sel.disabled = m !== "cont"; go.textContent = labels[m]; delete go.dataset.armed; };
  panel.querySelectorAll('input[name="addMode"]').forEach(r => r.addEventListener("change", syncMode)); syncMode();
  toggleBtn.addEventListener("click", () => { S.addOpen = panel.hidden; panel.hidden = !S.addOpen; if (S.addOpen){ panel.scrollIntoView({block: "nearest"}); tx.focus(); } });
  panel.querySelector("#addClose").addEventListener("click", () => { S.addOpen = false; panel.hidden = true; toggleBtn.focus(); });
  panel.querySelector("#addFile").addEventListener("change", e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    if (f.size > 3e6){ setAddMsg("That file is over 3 MB. Upload a plain-text file under 3 MB.", true); return; }
    const r = new FileReader(); r.onload = () => { tx.value = String(r.result || ""); count(); setAddMsg(`Loaded ${f.name}.`); };
    r.onerror = () => setAddMsg("Couldn't read that file. Try saving it as plain text (.txt) first.", true); r.readAsText(f);
  });
  const drop = panel.querySelector("#addDrop");
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); const f = e.dataTransfer.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { tx.value = String(r.result || ""); count(); }; r.readAsText(f); });
  panel.querySelector("#addCancel").addEventListener("click", () => { if (S.generating) S.generating.abort(); });
  const full = panel.querySelector("#fullTx");
  if (full){
    full.value = S.fullTxDraft != null && S.fullTxFor === n.id ? S.fullTxDraft : n.transcript;
    full.addEventListener("input", () => { S.fullTxDraft = full.value; S.fullTxFor = n.id; });
    if (S.fullTxFor === n.id && S.fullTxDraft != null) panel.querySelector("#txView").open = true;
    panel.querySelector("#saveTx").addEventListener("click", async e => {
      const b = e.currentTarget; b.disabled = true;
      try { const t = full.value.slice(0, 150000); await store.update(n.id, {transcript: t}); n.transcript = t; S.fullTxDraft = null; panel.querySelector("#txMsg").textContent = "Transcript saved. Choose \"Rebuild all notes\" to update the notes from it."; }
      catch(err){ panel.querySelector("#txMsg").textContent = "Couldn't save the transcript. Try again."; }
      b.disabled = false;
    });
  }
  go.addEventListener("click", () => addContent(n, go));
  if (S.addBusy){ go.disabled = true; panel.querySelector("#addProg").hidden = false; }
}
function setAddMsg(t, err){ const m = $("#addMsg"); if (!m) return; m.textContent = t; m.classList.toggle("err", !!err); }
async function addContent(n, go){
  if (S.generating) { setAddMsg("Claude is already working on something. Wait for it to finish.", true); return; }
  const mode = S.addMode || "new";
  const raw = ($("#addTx") || {}).value || "";
  let text = cleanTranscript(raw);
  if (mode !== "rebuild" && text.length < 40){ setAddMsg("Paste or upload the extra transcript content first.", true); return; }
  if (new Blob([text]).size > 200000) text = text.slice(0, 180000);
  if (mode === "rebuild" && !go.dataset.armed){ go.dataset.armed = "1"; go.textContent = "Click again to replace all notes"; setAddMsg("This replaces every section, key term and question."); return; }
  const full = $("#fullTx");
  const baseTx = full ? full.value : (n.transcript || "");
  const newTx = raw.trim() ? (baseTx.trim() ? baseTx.replace(/\s+$/,"") + "\n\n" + raw.trim() : raw.trim()) : baseTx;
  S.addBusy = true; go.disabled = true; setAddMsg("");
  $("#addProg").hidden = false;
  const seen = new Set();
  const onText = ({text: t}) => {
    const stat = $("#addStat"), list = $("#addList"); if (!stat) return;
    stat.textContent = `Writing… ${t.length.toLocaleString()} characters so far`;
    for (const m of t.matchAll(/"heading"\s*:\s*"((?:[^"\\]|\\.)*)"/g)){ if (!seen.has(m[1])){ seen.add(m[1]); const li = document.createElement("li"); li.textContent = m[1].replace(/\\"/g,'"'); list.append(li); } }
  };
  const u = JSON.parse(JSON.stringify(n));
  const now = Date.now(); let focus = null, done = "";
  const mergeGQ = add => {
    const have = new Set((u.glossary || []).map(g => g.term.toLowerCase()));
    u.glossary = [...(u.glossary || []), ...add.glossary.filter(g => !have.has(g.term.toLowerCase()))].slice(0, 40);
    u.quiz = [...(u.quiz || []), ...add.quiz].slice(0, 30);
  };
  try {
    if (mode === "new"){
      $("#addProgTitle").textContent = "Turning the new content into sections…";
      const res = await askClaude(addNewPrompt(n, text), onText);
      const add = normalize(res);
      if (!add.sections.length) throw {friendly: "Claude didn't return any new sections. Nothing was changed. Try again."};
      add.sections.forEach(s => s.addedAt = now);
      focus = u.sections.length; u.sections.push(...add.sections); mergeGQ(add);
      done = add.sections.length === 1 ? "Added 1 new section." : `Added ${add.sections.length} new sections.`;
    } else if (mode === "cont"){
      const i = Math.max(0, Math.min(u.sections.length - 1, +($("#contSec").value || 0)));
      const sec = u.sections[i];
      $("#addProgTitle").textContent = `Extending “${sec.heading}”…`;
      const res = await askClaude(contPrompt(n, sec, text), onText) || {};
      const str = v => typeof v === "string" ? v.trim() : "";
      const addEx = str(res.addedExplanation), pts = (Array.isArray(res.addedKeyPoints) ? res.addedKeyPoints : []).map(str).filter(Boolean);
      const ex = str(res.extraExample), rem = str(res.remember);
      if (!addEx && !pts.length && !ex) throw {friendly: "Claude didn't find anything new to add to that section. Nothing was changed."};
      if (addEx) sec.explanation = (sec.explanation ? sec.explanation.replace(/\s+$/,"") + "\n\n" : "") + addEx;
      sec.keyPoints = [...(sec.keyPoints || []), ...pts].slice(0, 10);
      if (ex) sec.example = sec.example ? sec.example + "\n\n" + ex : ex;
      if (rem) sec.remember = rem;
      if (res.diagram && typeof res.diagram === "object" && DTYPE[res.diagram.type]) sec.diagram = res.diagram;
      sec.updatedAt = now; focus = i;
      mergeGQ(normalize({glossary: res.glossary, quiz: res.quiz}));
      done = `Extended section ${i+1}.`;
    } else {
      $("#addProgTitle").textContent = "Rebuilding all notes from the full transcript…";
      const res = await askClaude(PROMPT + "\n\nTRANSCRIPT:\n<<<\n" + cleanTranscript(newTx).slice(0, 200000) + "\n>>>", onText);
      const fresh = normalize(res);
      if (!fresh.sections.length) throw {friendly: "Claude's answer had no sections. Nothing was changed. Try again."};
      Object.assign(u, {subtitle: fresh.subtitle, bigIdea: fresh.bigIdea, sections: fresh.sections, glossary: fresh.glossary, quiz: fresh.quiz, rebuiltAt: now});
      done = "Rebuilt all notes.";
    }
    u.transcript = newTx.slice(0, 150000); u.updatedAt = now;
    if (JSON.stringify(u).length > 240000) delete u.transcript;
    try { await store.save(u); } catch(e){ toast("Updated, but the changes couldn't be saved. Export a PDF to keep them."); }
    store.notes = store.notes.map(x => x.id === u.id ? u : x);
    S.addBusy = false; S.addOpen = false; S.addDraft = ""; S.fullTxDraft = null;
    renderShelf(); renderNote(); toast(done);
    const el = focus != null ? document.getElementById("sec-" + focus) : null;
    (el || $("#view")).scrollIntoView({block: "start"});
  } catch(e){
    S.addBusy = false;
    if (go.isConnected){ go.disabled = false; delete go.dataset.armed; go.textContent = {new: "Add as new sections", cont: "Add to this section", rebuild: "Rebuild all notes"}[mode]; }
    const p = $("#addProg"); if (p) p.hidden = true;
    setAddMsg(errText(e), !(e && (e.code === "aborted" || e.name === "AbortError")));
  }
}

const loadScript = src => new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => bad(new Error("load")); document.head.append(s); });
let libs = null;
function loadLibs(){
  if (!libs) libs = Promise.all([
    window.html2canvas ? 0 : loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
    window.jspdf ? 0 : loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")
  ]).catch(e => { libs = null; throw e; });
  return libs;
}
async function exportPdf(n, btn){
  const label = btn.textContent; btn.disabled = true; btn.textContent = "Preparing PDF…";
  try {
    const downloads = await cap("downloads");
    if (!downloads){ toast("PDF download isn't available in this view. Open the app on claude.ai to export."); return; }
    await loadLibs();
    try { await document.fonts.ready; } catch(e){}
    const stage = $("#pdfStage"); stage.innerHTML = noteHTML(n, true); mountDiagrams(stage, n, LIGHT_C);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:"pt", format:"a4"});
    const PW = pdf.internal.pageSize.getWidth(), PH = pdf.internal.pageSize.getHeight();
    const M = 44, CW = PW - 2*M, top = M, bottom = PH - M - 14;
    const ratio = CW / stage.offsetWidth;
    let y = top;
    const blocks = [...stage.querySelectorAll("[data-block]")];
    for (let i = 0; i < blocks.length; i++){
      btn.textContent = `Preparing PDF… ${Math.round(i / blocks.length * 100)}%`;
      const el = blocks[i];
      if (el.offsetHeight < 4) continue;
      const canvas = await window.html2canvas(el, {scale: 2, backgroundColor: "#FFFFFF", logging: false, useCORS: true});
      const hPt = canvas.height / 2 * ratio;
      const isHeading = el.classList.contains("end-h");
      if (y + hPt > bottom && y > top + 1 && hPt <= bottom - top){ pdf.addPage(); y = top; }
      if (isHeading && y + hPt + 80 > bottom){ pdf.addPage(); y = top; }
      if (hPt <= bottom - y){
        pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", M, y, CW, hPt); y += hPt + 6;
      } else {
        const pxPerPt = canvas.height / hPt; let off = 0;
        while (off < canvas.height){
          const room = bottom - y, slicePx = Math.min(canvas.height - off, Math.floor(room * pxPerPt));
          const c = document.createElement("canvas"); c.width = canvas.width; c.height = slicePx;
          const cx = c.getContext("2d"); cx.fillStyle = "#FFFFFF"; cx.fillRect(0,0,c.width,c.height); cx.drawImage(canvas, 0, off, canvas.width, slicePx, 0, 0, canvas.width, slicePx);
          pdf.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", M, y, CW, slicePx / pxPerPt);
          off += slicePx; y += slicePx / pxPerPt + 6;
          if (off < canvas.height){ pdf.addPage(); y = top; }
        }
      }
      if (el.classList.contains("sec-end") || (el.matches(".remember"))) y += 10;
    }
    const total = pdf.getNumberOfPages();
    for (let p = 1; p <= total; p++){
      pdf.setPage(p); pdf.setFontSize(8); pdf.setTextColor(110, 120, 135);
      const t = (n.title || "").replace(/[^\x20-\x7E -ÿ]/g, "");
      pdf.text(t.length > 80 ? t.slice(0,78) + "..." : t, M, PH - 24);
      pdf.text(`Page ${p} of ${total}`, PW - M, PH - 24, {align: "right"});
    }
    stage.innerHTML = "";
    const blob = pdf.output("blob");
    const fname = (n.title || "revision-notes").replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, " ").trim().slice(0, 90) + ".pdf";
    btn.textContent = "Saving…";
    try { await downloads.save({filename: fname, data: blob}); toast("PDF saved."); }
    catch(e){ if (e && (e.code === "dismissed" || e.code === "declined" || e.code === "cancelled")) toast("PDF not saved."); else toast("Couldn't save the PDF. Try again."); }
  } catch(e){
    toast("Couldn't build the PDF. Check your connection and try again.");
  } finally { btn.disabled = false; btn.textContent = label; $("#pdfStage").innerHTML = ""; }
}

/* ---------- Shell ---------- */
function render(){ renderShelf(); if (S.view === "new") renderComposer(); else renderNote(); }
function openComposer(){ S.view = "new"; S.addOpen = false; S.addDraft = ""; closeSide(); render(); window.scrollTo(0,0); setTimeout(() => { const t = $("#tx"); if (t && !t.value) t.focus(); }, 0); }
function openSide(){ $("#side").classList.add("open"); $("#scrim").hidden = false; }
function closeSide(){ $("#side").classList.remove("open"); $("#scrim").hidden = true; }
$("#newBtn").addEventListener("click", openComposer);
$("#menuBtn").addEventListener("click", openSide);
$("#scrim").addEventListener("click", closeSide);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSide(); });
const rethemer = () => { if (S.view === "note"){ const n = findNote(S.current); if (n) mountDiagrams($("#view"), n, themeC()); } };
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", rethemer); } catch(e){}
new MutationObserver(rethemer).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});

render();
store.init();
})();
</script>
